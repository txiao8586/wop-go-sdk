name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # macos-latest = arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: api golden gate (apidiff)
        run: |
          set -euo pipefail
          report=$(go run golang.org/x/exp/cmd/apidiff -m -allow-internal internal/api/api.golden .)
          if [ -n "$report" ]; then
            echo "::error::公共 API 与金样 internal/api/api.golden 不一致（差异见下）。若为有意变更，请重生成金样并与代码同 PR 提交：go run golang.org/x/exp/cmd/apidiff -m -w internal/api/api.golden ."
            printf '%s\n' "$report"
            exit 1
          fi
      - name: test + coverage
        run: |
          go test ./... -covermode=atomic -coverprofile=cover.out -coverpkg=.
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "total statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 98) { print "coverage " t "% < 98%"; exit 1 } }'
      - name: dependency whitelist
        run: |
          deps=$(go list -deps -f '{{if .Module}}{{.Module.Path}}{{end}}' . | sort -u | grep -Ev '^(github.com/wop-platform/wop-go-sdk|github.com/emmansun/gmsm|golang.org/x/crypto|golang.org/x/sys)$' | grep -v '^$' || true)
          if [ -n "$deps" ]; then echo "non-whitelisted deps:"; echo "$deps"; exit 1; fi
